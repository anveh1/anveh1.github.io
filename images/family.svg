<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration of a family of five holding hands">
  <!-- background -->
  
  <circle cx="318" cy="78" r="38" fill="#f0b25a" opacity=".85"/>
  <path d="M0 238 Q100 214 200 230 T400 222 V300 H0Z" fill="#e9b44c" fill-opacity=".14"/>
  <path d="M0 252 Q120 238 220 250 T400 246 V300 H0Z" fill="#e9b44c" fill-opacity=".22"/>

  <!-- small house outline (DIY nod) -->
  <g fill="none" stroke="#e9b44c" stroke-width="3" stroke-linejoin="round" opacity=".45">
    <path d="M40 150 L80 118 L120 150 V214 H40Z"/>
    <path d="M70 214 V184 H90 V214"/>
  </g>

  <!-- holding-hands line -->
  <path d="M118 176 Q140 186 162 172 M200 172 Q222 190 244 196 M262 198 Q276 206 292 204 M310 206 Q322 212 336 210"
        fill="none" stroke="#9a8f80" stroke-width="4" stroke-linecap="round"/>

  <!-- Dad -->
  <g>
    <rect x="124" y="226" width="9" height="30" rx="4" fill="#4a443c"/>
    <rect x="141" y="226" width="9" height="30" rx="4" fill="#4a443c"/>
    <path d="M114 130 Q137 118 160 130 L163 230 H111Z" fill="#2f6f6a"/>
    <circle cx="137" cy="104" r="20" fill="#d9a07a"/>
    <path d="M117 100 Q120 80 137 82 Q156 80 158 98 Q148 90 137 92 Q126 92 117 100Z" fill="#3a2a20"/>
  </g>

  <!-- Mom -->
  <g>
    <rect x="173" y="226" width="8" height="30" rx="4" fill="#4a443c"/>
    <rect x="189" y="226" width="8" height="30" rx="4" fill="#4a443c"/>
    <path d="M164 136 Q185 126 206 136 L214 230 H156Z" fill="#b4441f"/>
    <path d="M163 110 Q162 82 185 82 Q208 82 207 110 L209 140 Q185 132 161 140Z" fill="#5a3a26"/>
    <circle cx="185" cy="110" r="18" fill="#e8b894"/>
    <path d="M167 106 Q170 88 185 90 Q200 88 203 106 Q192 96 185 98 Q176 97 167 106Z" fill="#5a3a26"/>
  </g>

  <!-- Kid 1 (oldest) -->
  <g>
    <rect x="243" y="234" width="7" height="22" rx="3" fill="#4a443c"/>
    <rect x="256" y="234" width="7" height="22" rx="3" fill="#4a443c"/>
    <path d="M238 182 Q253 174 268 182 L270 238 H236Z" fill="#f0b25a"/>
    <circle cx="253" cy="164" r="15" fill="#e2ac85"/>
    <path d="M238 162 Q240 146 253 147 Q267 146 268 162 Q260 154 253 155 Q245 155 238 162Z" fill="#3a2a20"/>
  </g>

  <!-- Kid 2 -->
  <g>
    <rect x="291" y="238" width="6" height="18" rx="3" fill="#4a443c"/>
    <rect x="302" y="238" width="6" height="18" rx="3" fill="#4a443c"/>
    <path d="M286 196 Q299 190 312 196 L314 242 H284Z" fill="#2f6f6a"/>
    <circle cx="299" cy="180" r="13" fill="#e8b894"/>
    <path d="M286 178 Q287 165 299 166 Q311 165 312 178 Q305 171 299 172 Q292 172 286 178Z" fill="#5a3a26"/>
    <circle cx="287" cy="172" r="5" fill="#5a3a26"/>
    <circle cx="311" cy="172" r="5" fill="#5a3a26"/>
  </g>

  <!-- Kid 3 (youngest) -->
  <g>
    <rect x="333" y="242" width="6" height="14" rx="3" fill="#4a443c"/>
    <rect x="343" y="242" width="6" height="14" rx="3" fill="#4a443c"/>
    <path d="M329 206 Q341 200 353 206 L354 246 H328Z" fill="#b4441f"/>
    <circle cx="341" cy="192" r="12" fill="#e2ac85"/>
    <path d="M330 190 Q331 179 341 180 Q351 179 352 190 Q346 184 341 185 Q335 185 330 190Z" fill="#3a2a20"/>
  </g>

  <!-- little hearts -->
  <g fill="#b4441f" opacity=".7">
    <path d="M222 92 c-4 -6 -12 -2 -8 5 l8 8 l8 -8 c4 -7 -4 -11 -8 -5Z"/>
    <path d="M246 118 c-3 -4 -8 -1 -5 3 l5 5 l5 -5 c3 -4 -2 -7 -5 -3Z"/>
  </g>
</svg>
